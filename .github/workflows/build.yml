name: DeployMate V1.0 production builds

on:
  workflow_dispatch:
  push:
    tags: ['V*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: DeployMate-V1.0-windows-x64
            asset: DeployMate-V1.0-windows-x64.exe
            expected_arch: AMD64
          - name: macOS Intel x64
            os: macos-15-intel
            artifact: DeployMate-V1.0-macos-intel-x64
            asset: DeployMate-V1.0-macos-intel-x64.dmg
            expected_arch: x86_64
          - name: macOS Apple Silicon ARM64
            os: macos-15
            artifact: DeployMate-V1.0-macos-arm64
            asset: DeployMate-V1.0-macos-arm64.dmg
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      DEPLOYMATE_DB_MODE: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          python -c "import os, platform, sys; actual=platform.machine(); expected=os.environ['EXPECTED_ARCH']; print(f'Runner architecture: {actual}'); sys.exit(0 if actual.lower() == expected.lower() else 1)"

      - name: Verify clean production database
        shell: bash
        run: |
          python -c "import os,tempfile; from pathlib import Path; root=Path(tempfile.mkdtemp()); os.environ['DEPLOYMATE_DATA_DIR']=str(root); os.environ['DEPLOYMATE_DB_MODE']='prod'; from src.services.db_service import DatabaseService; from src.models import User,Project,Machine,DailyReport,Expense,ImportFile,ImportRow,get_session; db=DatabaseService(); s=get_session(); models=(User,Project,Machine,DailyReport,Expense,ImportFile,ImportRow); counts={m.__tablename__:s.query(m).count() for m in models}; s.close(); assert Path(db.db_path).name=='deploymate.db', db.db_path; assert all(v==0 for v in counts.values()), counts; print(f'Clean production database verified: {counts}')"

      - name: Build Windows x64 executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('logo.png').convert('RGBA').save('logo.ico', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build deploymate.spec
          Copy-Item dist\DeployMate.exe "${{ matrix.asset }}"

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          DMG_PATH: ${{ matrix.asset }}
        run: |
          bash ./build-macos.sh

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ matrix.asset }}" -PathType Leaf)) { throw "Missing EXE artifact" }
          if ((Get-Item "${{ matrix.asset }}").Length -le 0) { throw "EXE artifact is empty" }
          if (Select-String -Path "${{ matrix.asset }}" -Pattern "deploymate_dev.db" -SimpleMatch -Quiet) { throw "Development database marker found in release executable" }

      - name: Verify macOS application and DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          test -s "${{ matrix.asset }}"
          codesign --verify --deep --strict --verbose=2 dist/DeployMate.app
          actual_arch="$(lipo -archs dist/DeployMate.app/Contents/MacOS/DeployMate)"
          echo "Application architecture: $actual_arch"
          test "$actual_arch" = "$EXPECTED_ARCH"
          hdiutil verify "${{ matrix.asset }}"
          mount_point="$(mktemp -d)"
          hdiutil attach "${{ matrix.asset }}" -readonly -nobrowse -mountpoint "$mount_point"
          if find "$mount_point" -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.db-journal' \) | grep -q .; then
            hdiutil detach "$mount_point" || true
            echo "Database file found inside DMG"
            exit 1
          fi
          hdiutil detach "$mount_point"
          rmdir "$mount_point"
          hdiutil detach "/Volumes/DeployMate"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/V')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: DeployMate V1.0
          body: |
            DeployMate V1.0 production release.

            更新内容：

            - 新增管理员与普通用户账号体系、登录退出、用户启停和数据权限隔离。
            - 修改密码增加完整校验，成功后必须使用新密码重新登录。
            - 登录窗口补充 DeployMate Logo，首页移除“新建项目”快捷入口。
            - 费用改为单条记录同时填写考核费用和出差费用，直接计算并展示利润。
            - 修复费用计算预览显示不完整，并兼容旧版费用数据和汇总统计。
            - 完善首页看板、分页搜索、导入修复、项目导出、备份恢复和数据库迁移。
            - 增加账号权限、费用利润、分页、性能和回归测试。

            完整说明见 `docs/RELEASE_NOTES_v1.0.md`。

            发布文件：

            - Windows x64 single-file executable
            - macOS Intel x64 DMG (ad-hoc signed, not notarized)
            - macOS Apple Silicon ARM64 DMG (ad-hoc signed, not notarized)
            - Production data is stored locally and is separate from development data.
          files: |
            release-assets/*.exe
            release-assets/*.dmg
          overwrite_files: true
          fail_on_unmatched_files: true
