name: DeployMate V0.2 production builds

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: DeployMate-V0.2-windows-x64
          - name: macOS Intel x64
            os: macos-13
            artifact: DeployMate-V0.2-macos-intel-x64
          - name: macOS Apple Silicon ARM64
            os: macos-14
            artifact: DeployMate-V0.2-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Build Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('logo.png').convert('RGBA').save('logo.ico', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"
          python -m PyInstaller --noconfirm --clean --distpath dist-onedir --workpath build-onedir deploymate-onedir.spec
          Compress-Archive -Path dist-onedir\DeployMate -DestinationPath DeployMate-V0.2-windows-x64.zip -Force

      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./build-macos.sh

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: DeployMate-V0.2-windows-x64.zip

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/DeployMate.app
