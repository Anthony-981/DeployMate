name: DeployMate V0.2 production builds

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: DeployMate-V0.2-windows-x64
            archive: DeployMate-V0.2-windows-x64.zip
            expected_arch: AMD64
          - name: macOS Intel x64
            os: macos-13
            artifact: DeployMate-V0.2-macos-intel-x64
            archive: DeployMate-V0.2-macos-intel-x64.zip
            expected_arch: x86_64
          - name: macOS Apple Silicon ARM64
            os: macos-14-xlarge
            artifact: DeployMate-V0.2-macos-arm64
            archive: DeployMate-V0.2-macos-arm64.zip
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          python -c "import os, platform, sys; actual=platform.machine(); expected=os.environ['EXPECTED_ARCH']; print(f'Runner architecture: {actual}'); sys.exit(0 if actual.lower() == expected.lower() else 1)"

      - name: Build Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('logo.png').convert('RGBA').save('logo.ico', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"
          python -m PyInstaller --noconfirm --clean --distpath dist-onedir --workpath build-onedir deploymate-onedir.spec
          Compress-Archive -Path dist-onedir\DeployMate -DestinationPath "${{ matrix.archive }}" -Force

      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash ./build-macos.sh
          ditto -c -k --sequesterRsrc --keepParent dist/DeployMate.app "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: DeployMate V0.2
          body: |
            DeployMate V0.2 production release.

            - Windows x64 portable package
            - macOS Intel x64 application
            - macOS Apple Silicon ARM64 application
            - Production data is stored locally and is separate from development data.
          files: release-assets/*.zip
          fail_on_unmatched_files: true
