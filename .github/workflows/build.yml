name: DeployMate V0.2 production builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: DeployMate-V0.2-windows-x64
            asset: DeployMate-V0.2-windows-x64.exe
            expected_arch: AMD64
          - name: macOS Intel x64
            os: macos-15-intel
            artifact: DeployMate-V0.2-macos-intel-x64
            asset: DeployMate-V0.2-macos-intel-x64.dmg
            expected_arch: x86_64
          - name: macOS Apple Silicon ARM64
            os: macos-15
            artifact: DeployMate-V0.2-macos-arm64
            asset: DeployMate-V0.2-macos-arm64.dmg
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          python -c "import os, platform, sys; actual=platform.machine(); expected=os.environ['EXPECTED_ARCH']; print(f'Runner architecture: {actual}'); sys.exit(0 if actual.lower() == expected.lower() else 1)"

      - name: Build Windows x64 executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('logo.png').convert('RGBA').save('logo.ico', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build deploymate.spec
          Copy-Item dist\DeployMate.exe "${{ matrix.asset }}"

      - name: Import Apple Developer certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_BASE64" || { echo 'Missing APPLE_CERTIFICATE_BASE64'; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo 'Missing APPLE_CERTIFICATE_PASSWORD'; exit 1; }
          CERT_PATH="$RUNNER_TEMP/deploymate-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/deploymate-build.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p build-password "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p build-password "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k build-password "$KEYCHAIN_PATH"

      - name: Build, sign, notarize and staple macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for value in APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_BASE64; do
            test -n "${!value}" || { echo "Missing $value"; exit 1; }
          done
          bash ./build-macos.sh
          codesign --deep --force --verbose --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" dist/DeployMate.app
          codesign --verify --deep --strict --verbose=2 dist/DeployMate.app
          hdiutil create -volname DeployMate -srcfolder dist/DeployMate.app -ov -format UDZO "${{ matrix.asset }}"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          xcrun notarytool submit "${{ matrix.asset }}" --key "$API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple dist/DeployMate.app
          xcrun stapler staple "${{ matrix.asset }}"
          xcrun stapler validate dist/DeployMate.app
          xcrun stapler validate "${{ matrix.asset }}"
          spctl --assess --type open --context context:primary-signature --verbose dist/DeployMate.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: DeployMate V0.2
          body: |
            DeployMate V0.2 production release.

            - Windows x64 portable package
            - macOS Intel x64 application
            - macOS Apple Silicon ARM64 application
            - Production data is stored locally and is separate from development data.
          files: |
            release-assets/*.exe
            release-assets/*.dmg
          overwrite_files: true
          fail_on_unmatched_files: true
